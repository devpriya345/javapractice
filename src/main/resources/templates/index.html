
<!doctype html>
<html lang="en" xmlns:th="https://www.thymleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Add User</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/users">View Users</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact Us</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
  <h3> User Account Form</h3>
  
    <form th:action="@{/save-user}" th:object="${user}" method="post">
    <input type="hidden" th:field="*{userid}">
    <table>
   		 <tr>
  	 		 <td>fullname:</td>
  	 		 <td> <input type="text" th:field="*{fullname}"/></td>
    </tr>
     <tr>
  	 		 <td>email:</td>
  	 		 <td> <input type="email" th:field="*{email}"/></td>
    </tr>
     <tr>
  	 		 <td>Phno:</td>
  	 		 <td> <input type="number" th:field="*{phno}"/></td>
    </tr>
     <tr>
  	 		 <td>SSN:</td>
  	 		 <td> <input type="number" th:field="*{ssn}"/></td>
    </tr>
     <tr>
  	 		 <td>DOB:</td>
  	 		 <td> <input type="date" th:field="*{dob}"/></td>
    </tr>
     <tr>
  	 		 <td>Gender:</td>
  	 		 
  	 		 <td> <input type="radio" th:field="*{gender}" value="M"/> Male
  	 		   <input type="radio" th:field="*{gender}" value="F"/> Female
  	 		  </td>
    </tr>
    
    
    
    
    </table>
    <input type="submit" value ="Submit" class="btn btn-success"/>
    
    </form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
