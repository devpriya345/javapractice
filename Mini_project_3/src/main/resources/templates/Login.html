<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Login</title>

</head>

<body>

<h2>Login</h2>

<p th:text="${msg}"></p>

<form th:action="@{/login}" method="post">

Email

<input type="email"
name="email">

<br><br>

Password

<input type="password"
name="password">

<br><br>

<button type="submit">

Login

</button>

</form>

<br>

<a th:href="@{/register}">

Create Account

</a>

<br><br>

<a th:href="@{/forgot}">

Forgot Password

</a>

</body>

</html>
